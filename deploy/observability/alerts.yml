groups:
  - name: zerotrace-availability
    rules:
      - alert: ZeroTraceBffDown
        expr: up{job="zerotrace-bff"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "ZeroTrace BFF is not scrapeable"
          runbook: "docs/RUNBOOK-OPERATIONS.md#bff-or-engine-unavailable"

      - alert: ZeroTraceEngineDown
        expr: up{job="zerotrace-engine"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "ZeroTrace engine is not scrapeable"
          runbook: "docs/RUNBOOK-OPERATIONS.md#bff-or-engine-unavailable"

      - alert: ZeroTraceBffHighErrorRate
        expr: |
          sum(rate(zerotrace_http_requests_total{service="bff",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(zerotrace_http_requests_total{service="bff"}[5m])), 1)
          > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "BFF 5xx ratio is above 5%"
          runbook: "docs/RUNBOOK-OPERATIONS.md#high-error-rate"

      - alert: ZeroTraceBffLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(zerotrace_http_request_duration_seconds_bucket{service="bff"}[5m]))
          ) > 1
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "BFF p95 latency is above 1s"
          runbook: "docs/RUNBOOK-OPERATIONS.md#high-latency"

  - name: zerotrace-recon
    rules:
      - alert: ZeroTraceScanFailures
        expr: |
          sum(rate(zerotrace_scans_completed_total{state=~"failed|timed_out"}[15m]))
          /
          clamp_min(sum(rate(zerotrace_scans_completed_total[15m])), 1)
          > 0.10
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "More than 10% of scans are failing"
          runbook: "docs/RUNBOOK-OPERATIONS.md#scan-failures"

      - alert: ZeroTraceScheduledScanBlocked
        expr: increase(zerotrace_scheduled_scans_total{state="blocked"}[30m]) > 0
        labels:
          severity: ticket
        annotations:
          summary: "A scheduled scan was blocked by authorization or scope checks"
          runbook: "docs/RUNBOOK-OPERATIONS.md#scheduled-scan-blocked"

  - name: zerotrace-guard
    rules:
      - alert: ZeroTraceGuardBlocksSpike
        expr: |
          sum(rate(zerotrace_guard_inspections_total{blocked="true"}[5m]))
          > 5 * clamp_min(sum(rate(zerotrace_guard_inspections_total[5m])), 1)
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Guard block rate is unusually high"
          runbook: "docs/RUNBOOK-OPERATIONS.md#guard-block-spike"

  - name: zerotrace-intel
    rules:
      - alert: ZeroTraceIntelFeedStale
        expr: zerotrace_intel_feed_age_seconds > 93600
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "An Intel feed is older than 26 hours"
          runbook: "docs/RUNBOOK-OPERATIONS.md#intel-feed-stale"
