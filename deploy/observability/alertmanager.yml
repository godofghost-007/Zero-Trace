route:
  receiver: default
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # Replace with the operator's webhook, email, or pager integration.
    # Keeping a null receiver avoids claiming an on-call integration exists.
    webhook_configs: []
