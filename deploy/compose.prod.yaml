name: zerotrace

services:
  engine:
    build:
      context: ..
      dockerfile: Dockerfile.engine
    env_file:
      - ../.env.production
    environment:
      ZEROTRACE_ENGINE_HOST: 127.0.0.1
      ZEROTRACE_ENGINE_PORT: "8765"
      ZEROTRACE_LIVE_DB: /data/live-engine.sqlite3
    volumes:
      - engine_data:/data
    expose:
      - "8765"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  bff:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    # Share the engine network namespace so the BFF can use a loopback-only
    # engine URL. The engine port is not published to the host.
    network_mode: "service:engine"
    env_file:
      - ../.env.production
    environment:
      ZEROTRACE_ENV: production
      ZEROTRACE_TRUST_PROXY: "true"
      ZEROTRACE_COOKIE_SECURE: "true"
      AUTO_CREATE_SCHEMA: "false"
      DEMO_MODE: "false"
      ZEROTRACE_ENGINE_URL: http://127.0.0.1:8765
      ZEROTRACE_DATA_DIR: /data
      AUDIT_DB_PATH: /data/guard-audit.sqlite
    volumes:
      - bff_data:/data
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      engine:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ZEROTRACE_DOMAIN: ${ZEROTRACE_DOMAIN:?set ZEROTRACE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.5"

volumes:
  engine_data:
  bff_data:
  caddy_data:
  caddy_config:
