name: zerotrace

services:
  engine:
    image: ${ZEROTRACE_ENGINE_IMAGE:-zerotrace-engine:local}
    build:
      context: ..
      dockerfile: Dockerfile.engine
    env_file:
      - ${ZEROTRACE_ENV_FILE:-../.env.production}
    environment:
      ZEROTRACE_ENGINE_HOST: 127.0.0.1
      ZEROTRACE_ENGINE_PORT: "8765"
      ZEROTRACE_LIVE_DB: /data/live-engine.sqlite3
      HOME: /tmp
      TMPDIR: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    volumes:
      - engine_data:/data
    expose:
      - "8765"
    restart: unless-stopped
    read_only: true
    init: true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  guard:
    # Reuse the engine image so Guard ships with the same audited Python
    # dependency set. The command is overridden; Guard never starts the engine.
    image: ${ZEROTRACE_ENGINE_IMAGE:-zerotrace-engine:local}
    network_mode: "service:engine"
    command: ["python", "-m", "scripts.guard_proxy"]
    env_file:
      - ${ZEROTRACE_GUARD_ENV_FILE:-../.env.guard}
    environment:
      ZEROTRACE_GUARD_HOST: 127.0.0.1
      ZEROTRACE_GUARD_PORT: "8766"
      ZEROTRACE_GUARD_AUDIT_LOG: /data/guard-audit.jsonl
      HOME: /tmp
      TMPDIR: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    volumes:
      - guard_data:/data
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    init: true
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  bff:
    image: ${ZEROTRACE_BFF_IMAGE:-zerotrace-bff:local}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    # Share the engine network namespace so the BFF can use a loopback-only
    # engine URL. The engine port is not published to the host.
    network_mode: "service:engine"
    env_file:
      - ${ZEROTRACE_ENV_FILE:-../.env.production}
    environment:
      ZEROTRACE_ENV: production
      ZEROTRACE_TRUST_PROXY: "true"
      ZEROTRACE_COOKIE_SECURE: "true"
      AUTO_CREATE_SCHEMA: "false"
      DEMO_MODE: "false"
      ZEROTRACE_ENGINE_URL: http://127.0.0.1:8765
      ZEROTRACE_GUARD_PROXY_ENABLED: "true"
      ZEROTRACE_GUARD_PROXY_URL: http://127.0.0.1:8766
      ZEROTRACE_DATA_DIR: /data
      AUDIT_DB_PATH: /data/guard-audit.sqlite
    volumes:
      - bff_data:/data
    depends_on:
      engine:
        condition: service_healthy
      guard:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    init: true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: ${ZEROTRACE_CADDY_IMAGE:-zerotrace-caddy:local}
    build:
      context: .
      dockerfile: Dockerfile.caddy
    depends_on:
      engine:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ZEROTRACE_DOMAIN: ${ZEROTRACE_DOMAIN:?set ZEROTRACE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    read_only: true
    init: true
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.5"

volumes:
  engine_data:
  guard_data:
  bff_data:
  caddy_data:
  caddy_config:
