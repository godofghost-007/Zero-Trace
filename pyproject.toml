[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zerotrace"
version = "0.1.0.dev0"
description = "CPU-oriented cyber-defense platform foundation"
requires-python = ">=3.13"
license = {text = "Apache-2.0"}
dependencies = [
    "authlib>=1.9,<2",
    "cryptography>=43,<47",
    "dnspython>=2.6,<3",
    "fastapi>=0.115,<1",
    "httpx2>=2,<3",
    "psutil>=5.9,<8",
    "psycopg[binary]>=3.2,<4",
    "psycopg_pool>=3.2,<4",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
line-length = 88
target-version = "py313"
