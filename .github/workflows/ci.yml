name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  engine:
    name: Engine and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zerotrace
          POSTGRES_PASSWORD: zerotrace-ci-only
          POSTGRES_DB: zerotrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zerotrace -d zerotrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff
      - name: Lint (critical errors)
        run: ruff check app scripts tests --select E9,F63,F7,F82
      - name: Test with disposable PostgreSQL databases
        env:
          ZEROTRACE_TEST_DATABASE_URL: postgresql://zerotrace:zerotrace-ci-only@127.0.0.1:5432/zerotrace
        run: pytest -q

  bff:
    name: BFF and identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r frontend/requirements.txt
      - name: Test
        working-directory: frontend
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build BFF image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: zerotrace-bff:ci
      - name: Build engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.engine
          push: false
          tags: zerotrace-engine:ci
