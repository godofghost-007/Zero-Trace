name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scan added lines against the base branch
        run: |
          BASE="${{ github.base_ref || 'main' }}"
          git fetch origin "$BASE" --depth=1
          python scripts/scan_secrets.py --range "origin/$BASE...HEAD"

  engine:
    name: Engine and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zerotrace
          POSTGRES_PASSWORD: zerotrace-ci-only
          POSTGRES_DB: zerotrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zerotrace -d zerotrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff
      - name: Lint (critical errors)
        run: ruff check app scripts tests --select E9,F63,F7,F82
      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit
      - name: SBOM
        run: python scripts/generate_sbom.py --output sbom-engine.json
      - name: Upload engine SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-engine
          path: sbom-engine.json
      - name: Test with disposable PostgreSQL databases
        env:
          ZEROTRACE_TEST_DATABASE_URL: postgresql://zerotrace:zerotrace-ci-only@127.0.0.1:5432/zerotrace
        run: pytest -q

  bff:
    name: BFF and identity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zerotrace
          POSTGRES_PASSWORD: zerotrace-ci-only
          POSTGRES_DB: zerotrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zerotrace -d zerotrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r frontend/requirements.txt
      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r frontend/requirements.txt
      - name: SBOM
        run: |
          python scripts/generate_sbom.py \
            --requirements frontend/requirements.txt \
            --output sbom-bff.json
      - name: Upload BFF SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-bff
          path: sbom-bff.json
      - name: Test
        working-directory: frontend
        env:
          ZEROTRACE_TEST_DATABASE_URL: postgresql://zerotrace:zerotrace-ci-only@127.0.0.1:5432/zerotrace
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.18.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  observability:
    name: Observability config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create placeholder metrics token
        run: printf 'ci-only-token\n' > deploy/observability/metrics-token
      - name: Validate Prometheus rules
        run: |
          docker run --rm \
            -v "$PWD/deploy/observability:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.1.0 \
            check config /etc/prometheus/prometheus.yml
      - name: Validate Alertmanager config
        run: |
          docker run --rm \
            -v "$PWD/deploy/observability:/etc/alertmanager:ro" \
            --entrypoint amtool \
            prom/alertmanager:v0.28.1 \
            check-config /etc/alertmanager/alertmanager.yml

  runtime-smoke:
    name: Runtime security and load smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r frontend/requirements.txt
      - name: Security smoke
        run: python scripts/security_smoke.py
      - name: Load smoke
        run: |
          python scripts/load_test.py \
            --requests 100 --concurrency 10 --fail \
            --output load-test.json
      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke
          path: |
            load-test.json
            tasks/evidence/security-smoke.json

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build BFF image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: zerotrace-bff:ci
      - name: Build engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.engine
          push: false
          load: true
          tags: zerotrace-engine:ci
      - name: Build Caddy image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy
          file: ./deploy/Dockerfile.caddy
          push: false
          load: true
          tags: zerotrace-caddy:ci
      - name: BFF image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: zerotrace-bff:ci
          format: spdx-json
          artifact-name: sbom-bff-image.spdx.json
          dependency-snapshot: false
      - name: Engine image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: zerotrace-engine:ci
          format: spdx-json
          artifact-name: sbom-engine-image.spdx.json
          dependency-snapshot: false
      - name: Caddy image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: zerotrace-caddy:ci
          format: spdx-json
          artifact-name: sbom-caddy-image.spdx.json
          dependency-snapshot: false

  browser-e2e:
    name: Browser E2E and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            frontend/requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          version: "10.18.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r frontend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build UI
        working-directory: frontend
        run: pnpm build
      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Browser E2E and accessibility
        working-directory: frontend
        run: pnpm test:e2e
        env:
          ZEROTRACE_E2E_BROWSERS: chromium,firefox,webkit
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: frontend/.e2e-results
          if-no-files-found: ignore
